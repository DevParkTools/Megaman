function tone(f0, f1, d, w, v) {
  if (muted || !AC || VOL <= 0) return;
  var o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = w;
  o.frequency.setValueAtTime(f0, n);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), n + d);
  g.gain.setValueAtTime(v * VOL, n);
  g.gain.exponentialRampToValueAtTime(0.001, n + d);
  o.connect(g);
  g.connect(AC.destination);
  o.start(n);
  o.stop(n + d);
}

];

var WALKERS = [350, 800, 1000, 1450, 1700];
var FLYERS = [[500,120],[1100,100],[1650,90],[1850,110]];

var ATKD = [12, 12, 18, 16], ATKC = [8, 8, 24, 18], ATKW = [26, 26, 0, 0], LUN = [0.8, 0.8, 1.5, 0];
var RUN_SW = [3, 2, 0, -3, -2, 0];

var upg = [false, false, false, false], lives = 3, cleared = [];
var stageIdx = 0, stSel = 0, ST = null, bgG = null, seed = 1, segs = [], flag = null, cap = null;
var cpX = 40, capT = 0, rdy = 0, dT = 0;

var EFF = 1, SPD = 1;
var STAGES = [
  {n: '웹 랩', a: '#0b0620', b: '#2d1a4f', k: '#150d2c', l: '#7d5cff', g: '#3a3358', d: '#2a2543', u: '#9a7cff', c: '#8a4fd0', e: '#4a2a80', f: ['#c8b8ff', 0, 0.4, 1, 14], p: -1, q: 0},
  {n: '사이버 가든', a: '#052018', b: '#0d4a3a', k: '#07281f', l: '#4dffb0', g: '#1f4a42', d: '#163a33', u: '#5dffc8', c: '#e04aa0', e: '#8a2a68', f: ['#ff9ae0', 0.5, 0.8, 2, 2], p: 0, q: 2},
  {n: '스톰 타워', a: '#050a1c', b: '#1c2f5a', k: '#0a1230', l: '#ffe36b', g: '#2a3550', d: '#1d2740', u: '#7aa8ff', c: '#e8c43a', e: '#8a7418', f: ['#9cc8ff', -1.2, 7, 1, 8], w: true, p: -1, q: 1},
  {n: '마그마 파운드리', a: '#200603', b: '#5a1a08', k: '#2c0c06', l: '#ff8a2a', g: '#4a2a22', d: '#34201a', u: '#ff7a3a', c: '#e8502a', e: '#8a2410', f: ['#ffa040', 0.3, -1, 2, 2], v: true, p: 1, q: 3},
  {n: '제트 캐리어', a: '#0a2a5a', b: '#6fb6e8', k: '#3a6a9a', l: '#ffffff', g: '#4a5a70', d: '#364558', u: '#cfe6ff', c: '#4ab0e0', e: '#1a5a80', f: ['#ffffff', -3, 0.1, 22, 4], p: 3, q: 0},
  {n: '스포어 포레스트', a: '#0a1a08', b: '#27502a', k: '#102a12', l: '#c8ff6a', g: '#3a4a2a', d: '#2a3820', u: '#9aff5a', c: '#b8c83a', e: '#687418', f: ['#d8ff8a', 0.2, 0.6, 2, 2], p: -1, q: 2},
  {n: '블레이드 정글', a: '#04140e', b: '#14402a', k: '#082818', l: '#3aff7a', g: '#2a4a30', d: '#1c3822', u: '#4ac86a', c: '#3ac85a', e: '#1a7430', f: ['#7aff9a', 1, 1.2, 3, 1], p: 2, q: 1},
  {n: '프로스트 독', a: '#0a1a2e', b: '#4a7aa8', k: '#1a3452', l: '#cfefff', g: '#5a7a9a', d: '#456080', u: '#e8f8ff', c: '#8ae8f0', e: '#3a8a98', f: ['#ffffff', 0.3, 1.2, 2, 2], i: true, p: -1, q: 3},
  {n: '최종 요새', a: '#150208', b: '#4a0a1e', k: '#240610', l: '#ff4a6a', g: '#3a2230', d: '#281620', u: '#ff6a8a', c: '#c03a5a', e: '#6a1a30', f: ['#ff9aa8', 0.6, 1.4, 2, 2], p: -1, q: 4}
];

function rnd() {
  seed = (seed * 16807) % 2147483647;
  return seed / 2147483647;
}

function mkE(type, x, y) {
  return {x: x, y: y, w: type === 3 ? 20 : 14, h: type === 3 ? 24 : type === 2 ? 12 : type === 1 ? 10 : 14, hp: type === 3 ? 14 : type === 2 ? 4 : type === 1 ? 2 : 3, vx: -0.5, type: type, ox: x, oy: y, pl: x - 60, pr: x + 74, fy: y, inv: 0, sc: 0, sid: -1};
}

function applyUpg() {
  T1 = 30;
  T2 = 70;
  DS = ch ? ch.dash : 2;
  EFF = upg[0] ? 0.5 : 1;
  SPD = upg[3] ? 1.25 : 1;
  AD = upg[2] ? 1 : 0;
  BR = upg[1] ? 1 : 0;
}

function newGame(i) {
  ch = CHARS[i] || CHARS[0];
  upg = [false, false, false, false];
  lives = 3;
  cleared = [];
  ht = [];
  wp = [];
  cw = -1;
  applyUpg();
}

function respawn() {
  var p = player;
  if (!p) return;
  p.x = cpX; p.y = cpY; cam = Math.max(0, Math.min(LW - W, cpX - 200)); camY = Math.max(0, Math.min(LH - H, cpY - 150)); p.vx = 0; p.vy = 0; p.hp = p.maxhp; p.inv = 90; p.hurt = 0;
  p.dashT = 0; p.dj = false; p.charge = 0; p.atk = 0;
  bullets = []; ebul = [];
  if (boss && !boss.dead) boss = mkBoss();
  state = 'play';
}

function drawHeroO(p, c) {
  if (!p || !c) return;
  if (p.inv > 0 && p.hurt <= 0 && Math.floor(t / 3) % 2 === 0) return;
  var ox = p.x, oy = p.y, sp = p.spin > 0;
  if (sp) {
    ctx.save();
    ctx.translate(Math.floor(ox + 6), Math.floor(oy + 10));
    ctx.rotate((1 - p.spin / 20) * Math.PI * 2 * p.face);
    ctx.translate(-Math.floor(ox + 6), -Math.floor(oy + 10));
  }
  hgc = '#10131f';
  p.x = ox - 1; drawHero(p, c, true);
  p.x = ox + 1; drawHero(p, c, true);
  p.x = ox; p.y = oy - 1; drawHero(p, c, true);
  p.y = oy + 1; drawHero(p, c, true);
  p.y = oy;
  hgc = '#7cf';
  drawHero(p, c);
  if (sp) ctx.restore();
}

function drawBG() {
  if (!ST || !bgG) return;
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);
  var i, x, bh, wy, q = Math.floor(cam * 0.25 / 70), f = ST.f;
  ctx.save();
  ctx.translate(0, Math.floor(camY * 0.25));
  ctx.fillStyle = ST.k;
  for (i = 0; i < 9; i++) {
    x = i * 70 - (cam * 0.25) % 70 - 30;
    bh = 50 + ((i + q) * 37) % 100;
    ctx.fillRect(Math.floor(x), 230 - bh, 52, bh + 40);
  }
  ctx.fillStyle = ST.l;
  for (i = 0; i < 9; i++) {
    x = i * 70 - (cam * 0.25) % 70 - 30;
    bh = 50 + ((i + q) * 37) % 100;
    for (wy = 230 - bh + 8; wy < 220; wy += 14) {
      if (((i + q) * 13 + wy) % 3 !== 0) ctx.fillRect(Math.floor(x) + 8, wy, 4, 4);
      if (((i + q) * 7 + wy) % 4 === 0) ctx.fillRect(Math.floor(x) + 30, wy, 4, 4);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for (i = 0; i < 5; i++) ctx.fillRect(Math.floor(i * 130 - (cam * 0.5) % 130 - 20), 0, 14, 230);
  ctx.restore();
  if (ST.v) {
    ctx.fillStyle = '#ff5a1a';
    for (x = 0; x < W; x += 8) ctx.fillRect(x, LH - 32 - Math.floor(camY) + Math.floor(Math.sin(x * 0.1 + t * 0.1) * 3), 8, 40);
    ctx.fillStyle = '#ffd24a';
    for (x = 0; x < W; x += 24) ctx.fillRect(x + (t % 24), LH - 24 - Math.floor(camY), 6, 2);
  }
  ctx.fillStyle = f[0];
  for (i = 0; i < 36; i++) {
    x = (((i * 53 + t * f[1]) % W) + W) % W;
    wy = (((i * 37 + t * f[2]) % H) + H) % H;
    ctx.fillRect(Math.floor(x), Math.floor(wy), f[3], f[4]);
  }
  if (ST.w && t % 240 < 4) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawHUD() {
  var p = player, i;
  if (!p || !ch) return;
  ctx.fillStyle = '#10131f';
  ctx.fillRect(5, 5, 20, 20);
  ctx.fillStyle = ch.color;
  ctx.fillRect(7, 7, 16, 16);
  ctx.fillStyle = ch.acc;
  ctx.fillRect(13, 11, 8, 4);
  drawBar(11, 24, Math.max(0, p.hp), p.maxhp, '#6f6');
  drawText('x' + lives, 30, 20, 11, '#fff');
  for (i = 0; i < 4; i++) {
    ctx.fillStyle = upg[i] ? '#ffe36b' : '#333';
    if (ch && ch.type === 'shot') ctx.fillRect(30 + i * 8, 26, 6, 6);
  }
  drawText('ENTER 메뉴', W - 6, H - 5, 8, '#778', 'right');
  if (cw >= 0) {
    drawText(WN[cw], 30, 46, 9, WC[cw]);
    ctx.fillStyle = '#10131f';
    ctx.fillRect(29, 49, 50, 5);
    ctx.fillStyle = WC[cw];
    ctx.fillRect(30, 50, Math.max(0, we[cw]) * 3, 3);
  }
}

function drawStageSel() {
  var i, n;
  ctx.fillStyle = '#05051a';
  ctx.fillRect(0, 0, W, H);
  for (i = 0; i < 40; i++) {
    ctx.fillStyle = (i + Math.floor(t / 20)) % 7 === 0 ? '#fff' : '#557';
    ctx.fillRect((i * 97) % W, (i * 53) % H, 1, 1);
  }
  drawText('STAGE SELECT', W / 2, 40, 24, '#8cf', 'center');
  var done = 0;
  for (n = 0; n < 8; n++) {
    var S = STAGES[n], cx = 30 + (n % 4) * 112, cy = 56 + Math.floor(n / 4) * 84, on = stSel === n;
    ctx.fillStyle = S.a;
    ctx.fillRect(cx, cy, 104, 35);
    ctx.fillStyle = S.b;
    ctx.fillRect(cx, cy + 35, 104, 21);
    ctx.fillStyle = S.k;
    for (i = 0; i < 6; i++) ctx.fillRect(cx + 4 + i * 17, cy + 52 - ((i * 37 + n * 11) % 30), 12, 30);
    ctx.fillStyle = S.l;
    for (i = 0; i < 6; i++) ctx.fillRect(cx + 7 + i * 17, cy + 40 - ((i * 37 + n * 11) % 30) + 6, 3, 3);
    ctx.fillStyle = S.c;
    ctx.fillRect(cx + 78, cy + 14, 18, 28);
    ctx.fillStyle = '#10131f';
    ctx.fillRect(cx, cy + 56, 104, 18);
    drawText(S.n, cx + 52, cy + 69, 11, '#fff', 'center');
    if (S.p >= 0 && ch && ch.type === 'shot') {
      ctx.fillStyle = upg[S.p] ? '#ffe36b' : '#444';
      ctx.fillRect(cx + 6, cy + 6, 8, 8);
    }
    if (wp[n]) { ctx.fillStyle = WC[n]; ctx.fillRect(cx + 6, cy + 18, 8, 8); }
    if (cleared[n]) { done++; drawText('✔', cx + 98, cy + 14, 12, '#6f6', 'right'); }
    ctx.strokeStyle = on ? (Math.floor(t / 10) % 2 ? '#ff0' : '#fff') : '#334';
    ctx.lineWidth = on ? 3 : 1;
    ctx.strokeRect(cx, cy, 104, 74);
  }
  for (i = 0; i < 4; i++) {
    ctx.fillStyle = ch && ch.type === 'shot' ? (upg[i] ? '#ffe36b' : '#333') : '#1a1a22';
    ctx.fillRect(150 + i * 50, 238, 44, 14);
    drawText(PN[i], 172 + i * 50, 249, 9, upg[i] ? '#000' : '#888', 'center');
  }
  var fon = stSel === 8, fl = done >= 8;
  ctx.fillStyle = fl ? '#4a0a14' : '#1a1a22';
  ctx.fillRect(30, 218, 450 - 28, 16);
  ctx.strokeStyle = fon ? (Math.floor(t / 10) % 2 ? '#ff0' : '#fff') : '#334';
  ctx.lineWidth = fon ? 3 : 1;
  ctx.strokeRect(30, 218, 450 - 28, 16);
  drawText(fl ? (cleared[8] ? 'FINAL STAGE  ✔' : 'FINAL STAGE') : 'FINAL STAGE  잠김 - 8개 스테이지 클리어 필요', W / 2, 230, 11, fl ? '#f66' : '#667', 'center');
  drawText('LIFE x' + lives + '  HEART ' + htCount() + '/8', 30, 249, 10, '#fff');
  drawText(done >= 8 ? 'ALL STAGES CLEAR!' : '←→↑↓ 선택  ENTER 출격  A 무기전환  BACKSPACE 캐릭터', W / 2, 264, 10, done >= 8 ? '#ff0' : '#889', 'center');
}

function setKey(c, d) {
  var AX = window.AudioContext || window.webkitAudioContext;
  if (!AC && AX) AC = new AX();
  if (AC && AC.state === 'suspended') AC.resume();
  keys[c] = d;
  if (d) pressed[c] = true;
  else released[c] = true;
}


var items = [], zones = [], hrt = null, ht = [], wp = [], we = [], cw = -1, ct = 0, pt = 0, stx = -999, mA = '', mB = '';
var TR = ['거미줄 구역: 이동·점프력 감소', '가시꽃 + 점프 패드', '낙뢰 주의: 노란 선이 번쩍이면 피하세요', '화염 기둥 + 용암 웅덩이', '돌풍 + 컨베이어 벨트', '독가스 + 버섯 점프 패드', '움직이는 회전 톱날', '미끄러운 얼음 바닥 + 낙하 고드름', '모든 함정이 등장!'];
var WN = ['웹 샷', '꽃잎탄', '썬더', '화염구', '제트탄', '포자탄', '부메랑', '빙결탄'];
var WC = ['#c8b8ff', '#ff9ae0', '#ffe36b', '#ff7a3a', '#8fd3ff', '#c8ff6a', '#7aff9a', '#e8f8ff'];
var WK = [5, 3, 6, 7, 1, 2, 0, 4, -9];
var ROOT = [110, 123, 98, 87, 131, 104, 117, 92, 82];
var PAT = [[0,3,7,12,7,3,0,3,5,8,12,8,5,3,0,-1],[0,0,7,7,8,8,7,5,3,3,5,5,2,2,0,-1],[12,10,7,5,3,5,7,10,12,12,10,7,5,3,0,0],[0,7,3,7,5,8,7,12,10,7,5,7,3,5,2,0]];

function htCount() {
  var n = 0;
  for (var i = 0; i < 9; i++) if (ht[i]) n++;
  return n;
}

function bgm() {
  if (muted || !AC) return;
  var bo = boss && boss.active && !boss.dead && state === 'play';
  var spd = bo ? 6 : 8;
  if (t % spd !== 0) return;
  var sp = Math.floor(t / spd), r, v, n, f;
  if (state === 'select' || state === 'stage' || state === 'title' || state === 'option') { r = 110; v = 1; }
  else if (state === 'play') { r = ROOT[stageIdx] || 110; v = bo ? 3 : stageIdx % 3; }
  else return;
  n = PAT[v][sp % 16];
  if (n >= 0) {
    f = r * 2 * Math.pow(2, n / 12);
    tone(f, f, spd / 60 * 0.9, 'square', 0.022);
  }
  if (sp % 2 === 0) tone(r / 2, r / 2, spd / 60 * 1.6, 'triangle', 0.05);
}

function fanfare() {
  var N = [523, 659, 784, 1047, 784, 1047];
  for (var i = 0; i < N.length; i++) {
    (function (n, d) { setTimeout(function () { tone(n, n, 0.2, 'square', 0.06); }, d); })(N[i], i * 150);
  }
}

function cycleWpn() {
  for (var k = 1; k <= 9; k++) {
    var n = ((cw + 1 + k) % 9) - 1;
    if (n < 0 || wp[n]) { cw = n; break; }
  }
  tone(700, 900, 0.05, 'square', 0.05);
}

function useWeapon(p, big) {
  if (!p || cw < 0) return;
  var i = cw, f = p.face, x = f > 0 ? p.x + p.w + 2 : p.x - 8, y = p.y + 8, k;
  we[i] -= (big ? 3 : 1) * EFF;
  p.cool = 16;
  p.shootT = 14;
  function B(o) {
    o.w = (o.w || 6) * (big ? 1.6 : 1);
    o.h = (o.h || 6) * (big ? 1.6 : 1);
    o.dmg = (o.dmg || 2) * (big ? 2 : 1);
    o.life = o.life || 80;
    o.col = WC[i];
    o.wi = i;
    o.big = !!(o.pierce || big);
    o.wave = false;
    bullets.push(o);
  }
  if (i === 0) {
    for (k = -2; k <= 2; k++) B({x: x, y: y, vx: f * 3.5 * Math.cos(k * 0.2), vy: 3.5 * Math.sin(k * 0.2), dmg: 1, life: 30});
  } else if (i === 1) {
    for (k = -1; k <= 1; k++) B({x: x, y: y, vx: f * 3, vy: k * 1.2, life: 70});
  } else if (i === 2) {
    B({x: p.x + f * 70, y: 0, w: 8, h: 30, vx: 0, vy: 7, dmg: 3, life: 40, pierce: true});
  } else if (i === 3) {
    B({x: x, y: y, vx: f * 3, vy: -3, g: 0.25, w: 8, h: 8, dmg: 3, life: 90});
  } else if (i === 4) {
    B({x: x, y: y, vx: f * 8, w: 12, h: 5, dmg: 3, life: 60});
  } else if (i === 5) {
    B({x: x, y: y, vx: f * 2.2, w: 8, h: 8, dmg: 1, life: 36, split: true});
  } else if (i === 6) {
    B({x: x, y: y, vx: f * 4.5, w: 10, h: 10, dmg: 2, life: 100, bm: f, pierce: true});
  } else {
    for (k = -1; k <= 1; k++) B({x: x, y: y + k * 7, vx: f * 4.5, w: 8, h: 4, dmg: 2, life: 60});
  }
  tone(big ? 300 : 900, big ? 80 : 300, big ? 0.4 : 0.12, 'sawtooth', big ? 0.1 : 0.08);
}

function dropItem(e) {
  if (!e) return;
  if (e.type === 3) {
    items.push({x: e.x, y: e.y, vy: -2, type: 1, l: 900, w: 10, h: 10});
    items.push({x: e.x + 12, y: e.y, vy: -2, type: 1, l: 900, w: 10, h: 10});
    return;
  }
  var r = Math.random();
  if (r < 0.08) items.push({x: e.x, y: e.y, vy: -2, type: 1, l: 600, w: 10, h: 10});
  else if (r < 0.3) items.push({x: e.x, y: e.y, vy: -2, type: 0, l: 600, w: 6, h: 6});
}

function updateItems() {
  var p = player;
  if (!p) return;
  for (var i = items.length - 1; i >= 0; i--) {
    var it = items[i], ny;
    it.vy = Math.min(4, it.vy + 0.25);
    ny = it.y + it.vy;
    if (hit(it.x, ny, it.w, it.h)) it.vy = 0;
    else it.y = ny;
    it.l--;
    if (rect(p, it)) {

  if (!e.act) {
    if (Math.abs(p.x - e.x) < 230) { e.act = true; warnT = 70; tone(220, 220, 0.5, 'square', 0.1); }
    return;
  }
  e.sc++;
  e.vy = (e.vy || 0) + 0.3;
  e.y += e.vy;
  if (e.y >= e.fy) { e.y = e.fy; e.vy = 0; e.vx = 0; }

  if (e.vx) {

  }
  if (e.sc % 100 === 55) {
    for (var k = -1; k <= 1; k++) {
      var a = Math.atan2(p.y - e.y, p.x - e.x) + k * 0.3;

function P(x, y, w, h, c) {

function drawHero(p, c, gh) {

  var by = lnd ? 2 : (run && (f === 1 || f === 4)) ? -1 : 0;

    }
  }
  if (p.atk <= 0) return;
  var u = (ATKD[p.combo] - p.atk) / ATKD[p.combo], cb = p.combo;
  var cx = p.x + 6 + p.face * 4, cy = p.y + 9, rad = cb === 3 ? 30 : cb === 2 ? 26 : 20;
  var a0 = cb === 0 ? -1.3 : cb === 1 ? 1.0 : cb === 3 ? -2.4 : -2.6;
  var a1 = cb === 0 ? 0.7 : cb === 1 ? -0.9 : cb === 3 ? 1.0 : 1.5;
  var cur = a0 + (a1 - a0) * Math.min(1, u * 1.4);
  var nk = cb === 3 ? 18 : 10;
  for (var k = 0; k < nk; k++) {
    var a = cur - (a1 - a0) * k * (cb === 3 ? 0.04 : 0.06);
    var sz = cb === 3 ? Math.max(3, 7 - (k >> 1)) : Math.max(2, 5 - (k >> 1));
    ctx.fillStyle = k < 3 ? '#fff' : cb === 3 ? '#ffe36b' : '#8ef';
    ctx.fillRect(Math.floor(cx + p.face * Math.cos(a) * rad - sz / 2), Math.floor(cy + Math.sin(a) * rad * 0.85 - sz / 2), sz, sz);
  }
}

function deathBubbles(x, y) {
  var ring, i, n, a, sp;
  bub = [];
  for (ring = 0; ring < 3; ring++) {
    n = 8 + ring * 3;
    sp = 0.7 + ring * 0.55;
    for (i = 0; i < n; i++) {
      a = i / n * Math.PI * 2 + ring * 0.35;
      bub.push({x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3 + ring * 1.5 + Math.random() * 1.5, l: 70 + ring * 12 + Math.floor(Math.random() * 12), m: 90, ph: Math.random() * 6});
    }
  }
  for (i = 0; i < 10; i++) {
    a = Math.random() * Math.PI * 2;
    bub.push({x: x, y: y, vx: Math.cos(a) * (0.2 + Math.random() * 0.8), vy: Math.sin(a) * (0.2 + Math.random() * 0.8) - 0.3, r: 1.5 + Math.random() * 1.5, l: 50 + Math.floor(Math.random() * 40), m: 90, ph: Math.random() * 6});
  }
  burst(x, y, '#fff', 14, 6);
  tone(900, 200, 0.5, 'sine', 0.1);
}

function updBubbles() {
  for (var i = bub.length - 1; i >= 0; i--) {
    var b = bub[i];
    b.x += b.vx + Math.sin(t / 9 + b.ph) * 0.15;
    b.y += b.vy;
    b.vx *= 0.975;
    b.vy = b.vy * 0.975 - 0.012;
    b.l--;
    if (b.l <= 0) {
      if (b.r > 3.5 && i % 3 === 0) tone(1200 + (i % 5) * 150, 500, 0.06, 'sine', 0.04);
      burst(b.x, b.y, '#cfefff', 3, 2);
      bub.splice(i, 1);
    }
  }
}

function drawBubbles() {
  for (var i = 0; i < bub.length; i++) {
    var b = bub[i], al = Math.min(1, b.l / 25), r = b.r * (1 + (1 - b.l / b.m) * 0.25);
    ctx.globalAlpha = al * 0.9;
    ctx.fillStyle = 'rgba(150,230,255,0.28)';
    ctx.beginPath();
    ctx.arc(Math.floor(b.x), Math.floor(b.y), r, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#e8fbff';
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(b.x - r * 0.45), Math.floor(b.y - r * 0.5), Math.max(1, Math.floor(r * 0.35)), Math.max(1, Math.floor(r * 0.35)));
  }
  ctx.globalAlpha = 1;
}

function drawBul(b) {
  if (!b || !ch) return;
  var i;
  if (b.wave) {
    var hs = [10, 18, 26], ys = [8, 4, 0];
    ctx.fillStyle = ch.acc;
    for (i = 0; i < 3; i++) {
      ctx.fillRect(Math.floor(b.vx > 0 ? b.x + i * 4 : b.x + 8 - i * 4), Math.floor(b.y + ys[i]), 4, hs[i]);
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(b.vx > 0 ? b.x + 8 : b.x), Math.floor(b.y + 3), 4, 20);
    return;
  }
  ctx.fillStyle = b.col || ch.acc;
  ctx.fillRect(Math.floor(b.x), Math.floor(b.y), b.w, b.h);
  if (b.big) {
    ctx.fillStyle = ch.color;
    ctx.fillRect(Math.floor(b.vx > 0 ? b.x - 10 : b.x + b.w), Math.floor(b.y + 3), 10, b.h - 6);
    ctx.fillRect(Math.floor(b.x + 3), Math.floor(b.y - 2), b.w - 6, b.h + 4);
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(Math.floor(b.x + 2), Math.floor(b.y + b.h / 3), Math.max(1, b.w - 4), Math.max(1, Math.floor(b.h / 3)));
}

function drawBar(x, y, v, m, c) {
  ctx.fillStyle = '#000';
  ctx.fillRect(x - 1, y - 1, 10, m * 3 + 5);
  for (var i = 0; i < m; i++) {
    ctx.fillStyle = i < v ? c : '#333';
    ctx.fillRect(x, y + (m - i) * 3, 8, 2);
  }
}

function drawText(s, x, y, size, c, al) {
  ctx.font = 'bold ' + size + 'px sans-serif';
  ctx.fillStyle = c;
  ctx.textAlign = al || 'left';
  ctx.fillText(s, x, y);
}

function drawSelect() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05051a');
  g.addColorStop(1, '#1a1040');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  for (var i = 0; i < 40; i++) {
    ctx.fillStyle = (i + Math.floor(t / 20)) % 7 === 0 ? '#fff' : '#557';
    ctx.fillRect((i * 97) % W, (i * 53) % H, 1, 1);
  }
  drawText('NEO HUNTERS', W / 2, 50, 28, '#8cf', 'center');
  drawText('CHARACTER SELECT', W / 2, 72, 12, '#fff', 'center');
  for (var n = 0; n < 2; n++) {
    var c = CHARS[n], cx = 70 + n * 210, on = sel === n, o = selHero[n];
    ctx.fillStyle = on ? '#1c2a55' : '#10142a';
    ctx.fillRect(cx, 90, 140, 130);
    ctx.strokeStyle = on ? '#ff0' : '#334';
    ctx.lineWidth = on ? 3 : 1;
    ctx.strokeRect(cx, 90, 140, 130);
    var cyc = t % 180;
    o.x = 0; o.y = 0; o.face = 1; o.ground = true; o.vx = on ? 1 : 0; o.vy = 0; o.ra = t * 0.12;
    o.dashT = 0; o.dj = false; o.wall = 0; o.hurt = 0; o.inv = 0; o.shootT = 0; o.combo = 0;
    o.charge = on && cyc > 90 ? (cyc - 90) * 1.2 : 0;
    o.atk = (on && c.type === 'slash' && cyc < 12) ? 12 - cyc : 0;
    o.shootT = (on && c.type === 'shot' && cyc < 14) ? 14 - cyc : 0;
    ctx.save();
    ctx.translate(cx + 56, 108);
    ctx.scale(3, 3);
    drawHeroO(o, c);
    drawAura(o, c);
    ctx.restore();
    drawText(c.name, cx + 70, 195, 14, on ? '#ff0' : '#aaa', 'center');
    drawText(c.desc, cx + 70, 212, 10, '#ccc', 'center');
  }
  if (Math.floor(t / 30) % 2 === 0) drawText('← → 선택 / ENTER 시작', W / 2, 242, 12, '#fff', 'center');
  drawText('이동 ←→  대시 Z  점프 X  공격 C(꾹 누르면 차지)  특수무기 V  벽에서 X = 벽차기', W / 2, 262, 9, '#889', 'center');
}

function drawGame() {
  drawBG();
  var i, s;
  var sx = shake > 0 ? Math.floor(Math.random() * 5 - 2) : 0, sy = shake > 0 ? Math.floor(Math.random() * 5 - 2) : 0;
  ctx.save();
  ctx.translate(-Math.floor(cam) + sx, -Math.floor(camY) + sy);
  for (i = 0; i < SOL.length; i++) {
    s = SOL[i];
    if (s[0] > cam + W || s[0] + s[2] < cam || s[1] > camY + H + 20 || s[1] + s[3] < camY - 20) continue;
    ctx.fillStyle = ST.g;
    ctx.fillRect(s[0], s[1], s[2], s[3]);
    ctx.fillStyle = ST.d;
    var x0 = Math.max(s[0], Math.floor(cam / 16) * 16), x1 = Math.min(s[0] + s[2], cam + W + 16);
    for (var xx = x0; xx < x1; xx += 16) ctx.fillRect(xx, s[1] + 4, 1, s[3] - 4);
    for (var yy = s[1] + 10; yy < s[1] + s[3]; yy += 10) ctx.fillRect(Math.max(s[0], x0), yy, x1 - Math.max(s[0], x0), 1);
    ctx.fillStyle = ST.u;
    ctx.fillRect(s[0], s[1], s[2], 2);
  }
  drawZones();
  drawItems();
  drawObjs();
  for (i = 0; i < enemies.length; i++) {
    var e = enemies[i], fl = e.inv > 0;
    ctx.fillStyle = '#10131f';
    ctx.fillRect(Math.floor(e.x) - 1, Math.floor(e.y) - 1, e.w + 2, e.h + 2);
    if (e.type === 3) {
      ctx.fillStyle = fl ? '#fff' : ST.c;
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y), 20, 24);
      ctx.fillStyle = fl ? '#fff' : ST.e;
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y + 14), 20, 4);
      ctx.fillRect(Math.floor(e.x + 2), Math.floor(e.y + 20), 6, 4);
      ctx.fillRect(Math.floor(e.x + 12), Math.floor(e.y + 20), 6, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(e.x) - 1, Math.floor(e.y) - 8, 22, 5);
      ctx.fillStyle = '#f66';
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y) - 7, Math.max(0, Math.floor(20 * e.hp / 14)), 3);
    } else if (e.type === 2) {
      ctx.fillStyle = fl ? '#fff' : ST.e;
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y + 4), 14, 8);
      ctx.fillStyle = fl ? '#fff' : ST.c;
      ctx.fillRect(Math.floor(e.x + 2), Math.floor(e.y), 10, 6);
      ctx.fillRect(Math.floor(player && player.x < e.x ? e.x - 4 : e.x + 12), Math.floor(e.y + 2), 6, 3);
    } else if (e.type === 0) {
      var st = Math.floor(t / 8 + e.ox) % 2;
      ctx.fillStyle = fl ? '#fff' : '#c83';
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y), 14, 11);
      ctx.fillStyle = '#742';
      ctx.fillRect(Math.floor(e.x + (st ? 1 : 3)), Math.floor(e.y + 11), 4, 3);
      ctx.fillRect(Math.floor(e.x + (st ? 9 : 7)), Math.floor(e.y + 11), 4, 3);
    } else {
      var wf = Math.floor(t / 4) % 2;
      ctx.fillStyle = fl ? '#fff' : '#a3c';
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y + 2), 14, 8);
      ctx.fillStyle = '#d7f';
      ctx.fillRect(Math.floor(e.x - 3), Math.floor(e.y + (wf ? 0 : 3)), 4, 3);
      ctx.fillRect(Math.floor(e.x + 13), Math.floor(e.y + (wf ? 0 : 3)), 4, 3);
    }
    ctx.fillStyle = '#ff0';
    ctx.fillRect(Math.floor(e.x + 3), Math.floor(e.y + 3), 3, 3);
    ctx.fillRect(Math.floor(e.x + 8), Math.floor(e.y + 3), 3, 3);
  }
  drawBoss();
  for (i = 0; i < trail.length; i++) {
    ctx.globalAlpha = trail[i].l / 22;
    drawHero(trail[i], ch, true);
  }
  ctx.globalAlpha = 1;
  for (i = 0; i < bullets.length; i++) drawBul(bullets[i]);
  for (i = 0; i < ebul.length; i++) {
    ctx.fillStyle = '#f66';
    ctx.fillRect(Math.floor(ebul[i].x), Math.floor(ebul[i].y), ebul[i].w, ebul[i].h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(ebul[i].x + 1), Math.floor(ebul[i].y + 1), 2, 2);
  }
  if (state === 'ready' && player && rdy >= 120 && rdy < 140) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(player.x + 4), 0, 4, Math.floor((player.y + 20) * (rdy - 120) / 20));
  }
  if (state === 'clear' && player && ct >= 120 && ct < 150) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(player.x + 4), 0, 4, Math.floor((player.y + 20) * (1 - (ct - 120) / 30)));
  }
  if (state === 'play' || state === 'capsule' || (state === 'clear' && ct < 120) || (state === 'ready' && rdy >= 140)) {
    drawHeroO(player, ch);
    drawAura(player, ch);
    drawSlash(player);
  }
  if (state === 'capsule') drawCapFx();
  for (i = 0; i < parts.length; i++) {
    ctx.fillStyle = parts[i].c;
    ctx.fillRect(Math.floor(parts[i].x), Math.floor(parts[i].y), parts[i].s || 2, parts[i].s || 2);
  }
  drawBubbles();
  ctx.restore();
  drawHUD();
  if (boss && boss.active && !boss.dead) drawBar(W - 16, 8, boss.intro > 0 ? boss.fill : Math.max(0, boss.hp), boss.maxhp, '#f66');
  if (boss && boss.intro > 0) {
    if (boss.intro > 100 && Math.floor(t / 8) % 2) {
      ctx.fillStyle = 'rgba(255,0,0,0.18)';
      ctx.fillRect(0, 0, W, H);
    }
    if (boss.intro > 60) drawTextO('WARNING!', W / 2, 70, 26, Math.floor(t / 6) % 2 ? '#f33' : '#fff', 'center');
    if (boss.intro < 150) drawTextO(BN[stageIdx] || 'BOSS', W / 2, boss.intro > 60 ? 100 : 80, 18, '#ffe36b', 'center');
  }
  if (warnT > 0 && Math.floor(t / 6) % 2) drawTextO('MID BOSS', W / 2, 70, 20, '#ff0', 'center');
  if (state === 'ready' && ST) {
    var lb = rdy < 100 ? 26 : Math.max(0, 26 - (rdy - 100) * 1.3);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, lb);
    ctx.fillRect(0, H - lb, W, lb);
    if (rdy > 5 && rdy < 100) {
      var bx2 = rdy < 30 ? W / 2 - (30 - rdy) * 9 : W / 2;
      drawTextO('STAGE ' + (stageIdx < 8 ? stageIdx + 1 : 'FINAL'), bx2, 100, 13, '#8cf', 'center');
      drawTextO(ST.n, bx2, 128, 26, '#fff', 'center');
      drawTextO('특성: ' + (TR[stageIdx] || ''), bx2, 154, 12, '#ffd24a', 'center');
    }
    if (rdy >= 60 && rdy < 120 && Math.floor(rdy / 6) % 2 === 0) drawTextO('READY', W / 2, 190, 26, '#fff', 'center');
  }
  if (capT > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(110, 70, 260, 50);
    drawText(mA, W / 2, 92, 16, '#ffe36b', 'center');
    drawText(mB, W / 2, 110, 12, '#fff', 'center');
  }
  if (state === 'clear') {
    drawClear();
  } else if (state === 'ending') {
    drawEnding();
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    drawText(state === 'over' ? 'GAME OVER' : 'STAGE CLEAR!', W / 2, 130, 28, state === 'over' ? '#f55' : '#ff0', 'center');
    drawText('ENTER: 스테이지 선택으로', W / 2, 160, 12, '#fff', 'center');
  } else if (state === 'pause') {
    var PM = ['계속하기', '스테이지 다시 시작', '스테이지 선택으로', '볼륨', '소리 ' + (muted ? 'OFF' : 'ON')], v2;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    drawTextO('PAUSE', W / 2, 62, 24, '#8cf', 'center');
    for (i = 0; i < 5; i++) {
      var py = 98 + i * 26;
      if (pm === i) {
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.fillRect(130, py - 16, 220, 22);
      }
      drawText((pm === i ? '▶ ' : '   ') + PM[i], i === 3 ? 140 : W / 2, py, 14, pm === i ? '#ff0' : '#ccc', i === 3 ? 'left' : 'center');
      if (i === 3) {
        for (v2 = 0; v2 < 10; v2++) {
          ctx.fillStyle = v2 < Math.round(VOL * 10) ? '#8cf' : '#334';
          ctx.fillRect(230 + v2 * 10, py - 10, 8, 10);
        }
      }
    }
    drawText('↑↓ 선택   ENTER 확인   ESC 계속', W / 2, 252, 10, '#889', 'center');
  }
}

function draw() {
  if (!ctx) return;
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (state === 'title') drawTitle();
  else if (state === 'option') drawOption();
  else if (state === 'select') drawSelect();
  else if (state === 'stage') drawStageSel();
  else drawGame();
}

var last = 0, acc = 0;
function loop(ts) {
  acc += Math.min(100, ts - last);
  last = ts;
  while (acc >= 16.67) {
    update();
    pressed = {};
    released = {};
    acc -= 16.67;
  }
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', function (e) {
  if (!e) return;
  var AX = window.AudioContext || window.webkitAudioContext;
  if (!AC && AX) AC = new AX();
  if (AC && AC.state === 'suspended') AC.resume();
  if (e.code === 'KeyM' && !e.repeat) muted = !muted;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (rb >= 0) {
    if (!e.repeat) assignKey(e.code);
    return;
  }
  var kc = KM[e.code] || e.code;
  if (!e.repeat) pressed[kc] = true;
  keys[kc] = true;
});
window.addEventListener('keyup', function (e) {
  if (!e) return;
  var kc = KM[e.code] || e.code;
  keys[kc] = false;
  released[kc] = true;
});
resize();
window.addEventListener('resize', resize);
loadOpt();
if ('ontouchstart' in window) makeTouch();
requestAnimationFrame(loop);
</script>
</body>
